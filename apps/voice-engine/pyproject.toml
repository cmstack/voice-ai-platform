[project]
name = "voice-engine"
version = "0.1.0"
description = "Nova Sonic voice agent, Cal.com booking and CRM pipeline engine"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pipecat-ai[aws-nova-sonic,webrtc,websocket,silero]>=1.12.0",
    "asyncpg>=0.30.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "anthropic[bedrock]>=0.70.0",
    "apscheduler>=3.10.4,<4",
    "httpx>=0.27.0",
    "twilio>=9.3.0",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# pipecat-ai 1.12 caps Pillow below 13, but Pillow 12.x has known CVEs fixed in 13.0.0. The voice
# path never processes images (Pillow is only used for video frames), so lift the cap until we move
# to pipecat-ai >= 1.14, which allows Pillow 13.
override-dependencies = ["pillow>=13.0.0"]
